<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Main macOS Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="48%" stop-color="#11131B" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>

    <!-- Ambient Top-Left Glow -->
    <radialGradient id="topGlow" cx="26%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Bottom-Right Glow -->
    <radialGradient id="botGlow" cx="78%" cy="82%" r="58%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.24" />
    </linearGradient>

    <!-- Blossom Emblem Gradient -->
    <linearGradient id="blossomGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Terminal Accent Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>
  </defs>

  <!-- Main Icon Body -->
  <g clip-path="url(#squircleClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bgGrad)" />
    <rect x="100" y="100" width="824" height="824" fill="url(#topGlow)" />
    <rect x="100" y="100" width="824" height="824" fill="url(#botGlow)" />

    <!-- Subtle concentric grid rings -->
    <circle cx="512" cy="512" r="310" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2" />
    <circle cx="512" cy="512" r="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="8 8" />
  </g>

  <!-- Inner Glass Rim Highlight -->
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Center Codex Blossom Emblem -->
  <g transform="translate(278, 278) scale(19.5)">
    <path fill="#000000" fill-opacity="0.35" transform="translate(0, 0.55)"
