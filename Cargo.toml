[package]
name = "mini-codex"
version = "0.0.1"
edition = "2021"
description = "A Rust re-implementation of the Codex CLI: TUI, Responses API, ChatGPT/API-key auth, MCP, sessions, plugins"

[[bin]]
name = "mcodex"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry", "dep:muda"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "system-proxy"] }
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "sync", "net", "fs"] }
toml = "0.8"
unicode-width = "0.2"
tao = { version = "0.31", optional = true }
wry = { version = "0.49", optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
lopdf = { version = "0.45", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false, optional = true }
