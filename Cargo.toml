[package]
name = "mini-codex"
version = "0.2.0"
edition = "2021"
description = "A Rust re-implementation of the Codex CLI: TUI, Responses API, ChatGPT/API-key auth, MCP, sessions, plugins"

[[bin]]
name = "mcodex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "sync", "net", "fs"] }
toml = "0.8"
unicode-width = "0.2"
tao = "0.31"
wry = "0.49"
