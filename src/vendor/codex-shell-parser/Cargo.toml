[package]
name = "codex-shell-parser"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
codex-utils-absolute-path = { path = "../codex-absolute-path" }
once_cell = "1.20.2"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
shlex = "1.3.0"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "=0.26.4"
url = "2"
which = "8"

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1"
