[package]
name = "codex-execpolicy"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codex-utils-absolute-path = { path = "../codex-absolute-path" }
multimap = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3.0"
starlark = { version = "0.14.2", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }

[dev-dependencies]
pretty_assertions = "1"
